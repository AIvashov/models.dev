# Lab metadata carried over from providers/openrouter/models/openai/gpt-5-image-mini.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
type = "image"
name = "GPT-5 Image Mini"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt"
open_weights = false
release_date = "2025-10-16"

[modalities]
input = ["application/pdf", "image/jpeg", "image/png", "image/gif", "image/webp", "text"]
output = ["image", "text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 400_000
output = 128_000
