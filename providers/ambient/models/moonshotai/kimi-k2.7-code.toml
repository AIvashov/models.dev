# Kimi K2.7 Code always reasons; disabling thinking is rejected and it exposes
# no effort or budget control. https://platform.kimi.ai/docs/guide/use-kimi-k2-thinking-model
# Mid-conversation: Ambient serves this model on POST /v1/chat/completions (https://api.ambient.xyz/openapi.json); system_updates, effort_updates and tools.updates are unset: Ambient documents none of them and they weren't tested live.
# Status: deprecated; no longer listed by GET https://api.ambient.xyz/v1/models (checked 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
status = "deprecated"

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = true

[cost.text.input]
price = 0.69
cache = { read = 0.14, write = 0 }

[cost.text.output]
price = 3.49
