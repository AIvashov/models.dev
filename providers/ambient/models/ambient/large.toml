# Mid-conversation: Ambient serves this model on POST /v1/chat/completions (https://api.ambient.xyz/openapi.json); system_updates, effort_updates and tools.updates are unset: Ambient documents none of them and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-5.2"
name = "Ambient Large"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 202_752
output = 202_752

[cost.text.input]
price = 0.6
cache = { read = 0.15, write = 0 }

[cost.text.output]
price = 2
