# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = high|max
# Mid-conversation: Ambient serves this model on POST /v1/chat/completions (https://api.ambient.xyz/openapi.json); system_updates, effort_updates and tools.updates are unset: Ambient documents none of them and they weren't tested live.
# Status: deprecated; no longer listed by GET https://api.ambient.xyz/v1/models (checked 2026-10-20).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.08
cache = { read = 0.016, write = 0 }

[cost.text.output]
price = 0.18
