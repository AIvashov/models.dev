# Toggle: reasoning.enabled = true|false
# Ambient request schema: https://api.ambient.xyz/openapi.json
# Model controls: https://openrouter.ai/api/v1/models (qwen/qwen3.6-27b)
# Mid-conversation: Ambient serves this model on POST /v1/chat/completions (https://api.ambient.xyz/openapi.json); system_updates, effort_updates and tools.updates are unset: Ambient documents none of them and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3.6-27b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 32_768
output = 8_192

[cost.text.input]
price = 0.32
cache = { read = 0.16, write = 0 }

[cost.text.output]
price = 3.2
