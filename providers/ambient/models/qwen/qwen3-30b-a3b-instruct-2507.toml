# Mid-conversation: Ambient serves this model on POST /v1/chat/completions (https://api.ambient.xyz/openapi.json); system_updates, effort_updates and tools.updates are unset: Ambient documents none of them and they weren't tested live.
schema = 2
name = "Qwen3 30B A3B Instruct 2507"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
release_date = "2026-10-09"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 131_072
output = 32_768

[cost.text.input]
price = 0.09
cache = { read = 0.09, write = 0 }

[cost.text.output]
price = 0.3
