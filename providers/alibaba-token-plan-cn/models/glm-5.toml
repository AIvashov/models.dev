# structured_output: the Token Plan gateway accepts response_format json_schema
# (probed 2026-07-24) even though the base model and console report none.
# Mid-conversation: not probed live (no plan key) and the plan docs describe none of them, so system_updates, effort_updates and tools.updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
base_model = "zhipuai/glm-5"
open_weights = false

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
