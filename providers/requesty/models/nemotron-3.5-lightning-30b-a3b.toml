# Identity (https://router.requesty.ai/v1/models/managed (accessed 2026-10-20)): hugging_face_id nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16 (model_lab nvidia, open_weights true);
#   created 2026-08-11 = lab release_date. Host delta: context_window 1,048,576 (the model card's "up to 1M tokens",
