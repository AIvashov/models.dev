# Effort: reasoning_effort = low|high|max, matching GLM-5.3's native controls.
# Thinking is always enabled. Requesty's generic budget conversions document
# other model families, not a GLM-5.3 reasoning-token budget.
# https://docs.z.ai/guides/llm/glm-5.3
# https://docs.requesty.ai/features/reasoning
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates and tools.updates unset: Requesty documents neither and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 (EU)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = false
system_updates = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 1.2
cache = { read = 0.26 }

[cost.text.output]
price = 4.2
