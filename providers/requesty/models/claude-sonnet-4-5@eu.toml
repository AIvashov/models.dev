# system_updates = false: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates and tools.updates unset: Requesty documents neither and they weren't tested live.
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude Sonnet 4.5 (latest) (EU)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 3.3
cache = { read = 0.3, write = 4.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6.6
cache = { read = 0.6, write = 8.25 }

[cost.text.output]
price = 16.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 24.75
