# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates and tools.updates unset: Requesty documents neither and they weren't tested live.
schema = 2
name = "devstral-latest@eu"
description = "An enterprise grade text model, that excels at using tools to explore codebases, editing multiple files and power software engineering agents."
family = "devstral"
open_weights = false
release_date = "2026-05-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
system_updates = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.44
cache = { read = 0.44 }

[cost.text.output]
price = 2.2
