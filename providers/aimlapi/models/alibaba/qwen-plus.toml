# No caller control: reasoning_effort is not read (an invalid value returns 200),
# and toggle/budget fields are dropped by the gateway (unknown top-level keys -> 200).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AI/ML API documents none of them and they weren't tested live.
schema = 2
base_model = "alibaba/qwen-plus"

[capabilities]
reasoning = { supported = true }

[limit]
context = 131_000
output = 16_384

[cost.text.input]
price = 0.52
cache = { read = 0.104 }

[cost.text.output]
price = 1.56
