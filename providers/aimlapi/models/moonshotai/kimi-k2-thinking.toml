# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AI/ML API documents none of them and they weren't tested live.
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[capabilities]
reasoning = { supported = true }

[limit]
output = 98_304

[cost.text.input]
price = 0.82524
cache = { read = 0.20631 }

[cost.text.output]
price = 3.4385
