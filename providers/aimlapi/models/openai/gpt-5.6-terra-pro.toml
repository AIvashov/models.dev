# Off: reasoning_effort = none (0 reasoning tokens); no toggle field on this surface.
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AI/ML API documents none of them and they weren't tested live.
schema = 2
base_model = "openai/gpt-5.6-terra"
name = "GPT-5.6 Terra Pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 2.7508
cache = { read = 0.27508 }

[cost.text.output]
price = 16.5048
