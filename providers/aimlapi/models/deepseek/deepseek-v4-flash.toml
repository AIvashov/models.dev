# Off: reasoning_effort = none (0 reasoning tokens); no toggle field on this surface.
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AI/ML API documents none of them and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.39
cache = { read = 0.0078 }

[cost.text.output]
price = 1.56
