# GLM-5.3-FlashX uses the same model and forced-thinking effort levels as Flash.
# https://docs.z.ai/guides/vlm/glm-5.3-flash
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 FlashX"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[cost.text.output]
price = 1.25
