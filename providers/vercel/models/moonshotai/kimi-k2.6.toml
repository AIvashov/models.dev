# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = true

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
