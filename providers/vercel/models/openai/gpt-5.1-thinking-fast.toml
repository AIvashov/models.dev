# Modalities: OpenAI image inputs PNG, JPEG, WEBP, non-animated GIF, https://platform.openai.com/docs/guides/images-vision
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system/developer messages stay in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
name = "GPT 5.1 Thinking (Fast)"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt"
open_weights = false
release_date = "2025-11-12"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
system_updates = true

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 20
