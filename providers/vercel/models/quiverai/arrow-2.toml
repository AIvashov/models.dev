# https://docs.quiver.ai/api-reference/openresponses/createopenresponse
# temperature = false: this route is Quiver's Responses API (it carries tools, which the native SVG endpoints lack),
#   and https://docs.quiver.ai/api-reference/openresponses/create-open-response says Arrow 2 and Telos "accept omission
#   or the default value 1; non-default values are rejected on the current public deployment". Vercel's catalog
#   (GET https://ai-gateway.vercel.sh/v1/models, 2026-10-20) still lists temperature; a live check wasn't possible.
# Mid-conversation (@ai-sdk/gateway): system_updates, effort_updates and tools.updates are unset: the gateway documents none of them for this model, and live cache results on the default route were inconclusive.
schema = 2
base_model = "quiverai/arrow-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
temperature = false

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 20
