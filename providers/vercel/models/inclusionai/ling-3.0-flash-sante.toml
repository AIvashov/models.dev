# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "inclusionai/ling-3.0-flash-sante"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
system_updates = true

[limit]
context = 256_000
output = 32_000

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.22
