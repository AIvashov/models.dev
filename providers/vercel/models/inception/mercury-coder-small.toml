# Mid-conversation (@ai-sdk/gateway): system_updates, effort_updates and tools.updates are unset: the gateway documents none of them for this model, and live cache results on the default route were inconclusive.
schema = 2
name = "Mercury Coder Small Beta"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
family = "mercury"
open_weights = false
release_date = "2025-02-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_000
output = 16_384

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
