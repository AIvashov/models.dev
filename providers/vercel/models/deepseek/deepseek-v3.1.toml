# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v3.1"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
system_updates = false

[limit]
context = 163_840
output = 128_000

[cost.text.input]
price = 0.25
cache = { read = 0.13 }

[cost.text.output]
price = 0.95
