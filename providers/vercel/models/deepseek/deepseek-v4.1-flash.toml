# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = high|xhigh (Vercel gateway aliases)
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
system_updates = true

[limit]
context = 1_048_576
output = 32_768

[cost.text.input]
price = 0.075
cache = { read = 0.0015 }

[cost.text.output]
price = 0.3
