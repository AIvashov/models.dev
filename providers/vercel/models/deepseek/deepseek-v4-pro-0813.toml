# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
description = "Flagship DeepSeek model for coding, reasoning, and agentic work"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
system_updates = true

[cost.text.input]
price = 0.66
cache = { read = 0.066 }

[cost.text.output]
price = 1.98
