# Modalities: generic image kept, Elorian publishes no image format list for Glimpse
# Mid-conversation (@ai-sdk/gateway): system_updates, effort_updates and tools.updates are unset: the gateway documents none of them for this model, and live cache results on the default route were inconclusive.
schema = 2
name = "Glimpse"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-10-16"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }

[limit]
context = 220_000
output = 4_096

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 3
