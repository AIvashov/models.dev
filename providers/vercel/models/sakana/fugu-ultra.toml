# Mid-conversation (@ai-sdk/gateway): system_updates, effort_updates and tools.updates are unset: the gateway documents none of them for this model, and live cache results on the default route were inconclusive.
schema = 2
base_model = "sakana/fugu-ultra"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
output = 1_000_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 45
