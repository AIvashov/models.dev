# Sources (accessed 2026-07-22):
# - https://ai-gateway.vercel.sh/v1/models (poolside/laguna-s-2.1-free) — tags reasoning; supported_parameters include reasoning
# - https://huggingface.co/poolside/Laguna-S-2.1 — per-request thinking via enable_thinking
# - https://docs.poolside.ai/get-started/supported-models — thinking on or off per request
# API: {"chat_template_kwargs": {"enable_thinking": false}}
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "poolside/laguna-s-2.1"
name = "Laguna S 2.1 Free"
description = "Free provider route for experiments, demos, and cost-sensitive chat workloads"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false
system_updates = true

[limit]
context = 256_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
