# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (1..32768 reasoning tokens)
# Sources:
# - https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# - https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-5-lightning-30b-a3b-infer
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"
name = "Nemotron 3.5 Lightning 30B"
description = "Nemotron model for efficient reasoning, coding, and specialized AI agents"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = true

[limit]
output = 131_072

[cost.text.input]
price = 0.05
cache = { read = 0.01 }

[cost.text.output]
price = 0.2
