# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
system_updates = false

[limit]
output = 524_288

[cost.text.input]
price = 0

[cost.text.output]
price = 0
