# Modalities: MiMo image formats JPEG, PNG, GIF, WebP, BMP, https://mimo.mi.com/static/docs/quick-start/usage-guide/multimodal-understanding/image-understanding.md
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "xiaomi/mimo-v2.5"
name = "MiMo M2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
system_updates = true

[limit]
context = 1_050_000
output = 131_100

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
