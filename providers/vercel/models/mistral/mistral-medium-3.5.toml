# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "mistral/mistral-medium-3-5"
name = "Mistral Medium Latest"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
system_updates = false

[limit]
output = 256_000

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
