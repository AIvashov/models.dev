# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "mistral/mistral-large-2512"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"

[capabilities]
tools = { supported = false }
system_updates = true

[limit]
output = 256_000

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 1.5
