# Previously a symlink to providers/mistral/models/codestral-latest.toml. Copied from origin/dev 67bc657a5 so Vercel's data
# stays as it was when the Mistral file moved to schema 2 with Mistral-API-specific values.
# Cached-input pricing: https://docs.mistral.ai/inference/pricing (2026-09-29)
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "mistral/codestral-latest"

[capabilities]
system_updates = false

[limit]
context = 128_000
output = 4_000

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 0.9
