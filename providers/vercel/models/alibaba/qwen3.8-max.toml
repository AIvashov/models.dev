# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3.8-max-preview"
name = "Qwen 3.8 Max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
system_updates = false

[limit]
context = 262_144
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
