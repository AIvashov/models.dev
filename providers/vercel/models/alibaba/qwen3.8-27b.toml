# Reasoning effort: reasoning.effort = none|low|medium|xhigh
# Source: https://huggingface.co/Qwen/Qwen3.8-27B
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3.8-27b"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
system_updates = true

[limit]
context = 1_000_000
output = 131_072

[cost.text.input]
price = 0.5
cache = { read = 0.1, write = 0.625 }

[cost.text.output]
price = 3
