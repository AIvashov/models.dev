# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): routed to Amazon Bedrock Converse, which rejects system-role messages for this model (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html), so the gateway cannot keep them in place. effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3-coder-next"
description = "Qwen coding model for software agents, repository edits, and code reasoning"

[capabilities]
reasoning = { supported = true }
structured_output = true
system_updates = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.2
