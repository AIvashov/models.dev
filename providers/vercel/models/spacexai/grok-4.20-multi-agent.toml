# Modalities: xAI image inputs jpg/jpeg and png, https://docs.x.ai/docs/guides/image-understanding
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system messages stay in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
name = "Grok 4.20 Multi-Agent"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-03-10"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
system_updates = true

[limit]
context = 2_000_000
output = 2_000_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_001 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_001 } }
price = 5
