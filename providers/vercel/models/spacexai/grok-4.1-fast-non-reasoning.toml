# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system messages stay in place (cache prefix kept). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "xai/grok-4.1-fast"
name = "Grok 4.1 Fast Non-Reasoning"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
system_updates = true

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
