# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): Gemini takes system text only as systemInstruction, and a mid-conversation system message is hoisted there (cache miss). effort_updates and tools.updates are unset: the gateway documents neither for this model and they weren't tested live.
schema = 2
base_model = "google/gemini-4-argon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = false

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10
