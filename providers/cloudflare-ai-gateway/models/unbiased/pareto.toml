# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/). effort_updates and tools.updates are unset: the gateway documents neither for this route and they weren't tested live.
# Live 2026-10-19: a mid-conversation system message keeps the cached prefix (in place).
schema = 2
base_model = "unbiased/pareto"

[capabilities]
cache = { supported = true, implicit = true }
system_updates = true
structured_output = false

[limit]
context = 262_144

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 7.5
