# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning), and none was tested live, so the flags are unset except where noted. Live (2026-10-19) a mid-conversation system message was accepted by Kimi-K2.5 and Llama-3.3-70B-Instruct.
schema = 2
name = "Command A"
description = "Cohere command model for multilingual enterprise agents, tools, and chat"
family = "command-a"
open_weights = true
knowledge = "2024-06-01"
release_date = "2025-03-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 131_072
output = 8_192

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
