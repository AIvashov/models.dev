# Modalities: audio from Venice's docs; video from Venice's docs. Venice documents audio (input_audio.format) and video (video_url) formats and file parts (PDF) in https://docs.venice.ai/swagger.yaml, but no image formats.
# Mid-conversation (Venice /api/v1/chat/completions, live probes 2026-10-20): system_updates = false. Venice hoists a later system message into the
# leading system block: with W = [system, user, assistant, system, user], W + [assistant, user] read W from cache but W + [assistant, system, user] read 0,
# on 12 models across Anthropic, OpenAI, Google, xAI, Moonshot, MiniMax, Z.AI, Qwen, DeepSeek, Xiaomi and NVIDIA routes (anonymized and private).
# effort_updates and tools.updates unset: Venice documents neither and they weren't tested live.
# Cache: implicit = true, prompt_cache_key = true. Caching is automatic and `prompt_cache_key` is a routing hint (https://docs.venice.ai/guides/features/prompt-caching).
schema = 2
name = "Muse Wonder"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "muse"
open_weights = false
release_date = "2026-10-12"
last_updated = "2026-10-15"

[modalities]
input = ["text", "image", "audio/wav", "audio/mpeg", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mp4", "video/mp4", "video/mpeg", "video/quicktime", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = false
cache = { supported = true, implicit = true }
prompt_cache_key = true

[limit]
context = 1_048_576
output = 131_072

[cost.text.input]
price = 5
cache = { read = 0.25 }

[cost.text.output]
price = 25
