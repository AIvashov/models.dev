# Chat: `reasoning_effort = low|medium|high`; Responses: `reasoning.effort`.
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/gpt-oss-120b/
# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions (https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/); system_updates, effort_updates and tools.updates are unset: OVHcloud AI Endpoints documents none of them and they weren't tested live.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 131_072

[cost.text.input]
price = 0.09

[cost.text.output]
price = 0.47
