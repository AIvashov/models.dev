# Chat `reasoning_effort` supports none|low|medium|high; `none` disables it.
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/qwen-3-5-9b/
# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions (https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/); system_updates, effort_updates and tools.updates are unset: OVHcloud AI Endpoints documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; OVHcloud's catalog reports image input without formats (https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter).
schema = 2
base_model = "alibaba/qwen3.5-9b"
name = "Qwen3.5-9B"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.18
