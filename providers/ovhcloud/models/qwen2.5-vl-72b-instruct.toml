# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions (https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/); system_updates, effort_updates and tools.updates are unset: OVHcloud AI Endpoints documents none of them and they weren't tested live.
schema = 2
base_model = "alibaba/qwen2-5-vl-72b-instruct"
name = "Qwen2.5-VL-72B-Instruct"
description = "Multimodal model for analyzing text, images, documents, and rich media"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 1.01

[cost.text.output]
price = 1.01
