# Sources (accessed 2026-09-11):
# https://ofox.ai/models/deepseek/deepseek-v4-flash-0423
# https://api.ofox.ai/v1/models/deepseek/deepseek-v4-flash-0423
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/deepseek).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0423"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.19
cache = { read = 0.028 }

[cost.text.output]
price = 0.51
