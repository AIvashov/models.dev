# https://ofox.ai/models/google/gemini-3.1-flash-lite
# https://ai.google.dev/gemini-api/docs/pricing
# https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: implicit (https://ofox.ai/docs/develop/models/gemini#caching); explicit cachedContents is on the Gemini native API only.
# Effort: reasoning_effort = minimal|low|medium|high (https://ofox.ai/docs/develop/models/gemini/thinking)
schema = 2
base_model = "google/gemini-3.1-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 1 }

[cost.text.output]
price = 1.5

[cost.audio.input]
price = 0.5
