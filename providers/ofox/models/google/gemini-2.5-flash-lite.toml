# https://ofox.ai/en/models/google/gemini-2.5-flash-lite
# Toggle/budget (Gemini native): generationConfig.thinkingConfig.thinkingBudget
# 0 disables; enabled manual budgets 512..24576
# https://ai.google.dev/gemini-api/docs/thinking
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: implicit (https://ofox.ai/docs/develop/models/gemini#caching); explicit cachedContents is on the Gemini native API only.
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 512, max = 24_576 } }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 1 }

[cost.text.output]
price = 0.4

[cost.audio.input]
price = 0.3
