# Prices, including the >272K context tier: Ofox catalog pricing.context_price_tiers (https://api.ofox.ai/v2/models/catalog?include=provider_price&limit=500).
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates and tools.updates are unset; Ofox documents none of them and they weren't tested live.
# Cache: none; the Ofox catalog has no prompt_caching and no cache price for this model.
# Effort: reasoning.effort = medium|high|xhigh (https://ofox.ai/docs/develop/models/gpt/reasoning)
schema = 2
base_model = "openai/gpt-5.4-pro"

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = false
cache = { supported = false }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
