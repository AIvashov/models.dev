# Sources:
# - https://ofox.ai/en/models/openai/gpt-5 (list pricing)
# - https://api.ofox.ai/v2/models/catalog?include=provider_price (input/output/cache_read)
# Reasoning effort: OpenAI first-party gpt-5 + relay peers (minimal/low/medium/high)
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates and tools.updates are unset; Ofox documents none of them and they weren't tested live.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
schema = 2
base_model = "openai/gpt-5"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { supported = true, implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.13 }

[cost.text.output]
price = 10
