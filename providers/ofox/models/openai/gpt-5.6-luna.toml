# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates and tools.updates are unset; Ofox documents none of them and they weren't tested live.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max (https://ofox.ai/docs/develop/models/gpt/reasoning)
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04, write = 0.5 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
