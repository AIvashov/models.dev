# Source: https://api.ofox.ai/v2/models/catalog?include=provider_price&limit=500
# Ofox reports capabilities.reasoning=false for this route, so it does not inherit OpenAI effort controls.
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates and tools.updates are unset; Ofox documents none of them and they weren't tested live.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
schema = 2
base_model = "openai/gpt-5-nano"

[capabilities]
reasoning = { supported = false }
structured_output = true
cache = { supported = true, implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.05
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
