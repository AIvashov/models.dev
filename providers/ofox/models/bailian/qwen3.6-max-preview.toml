# Sources:
# - https://ofox.ai/models/bailian/qwen3.6-max-preview (Ofox model page: $2/$12 per 1M, cache read $0.2, cache write $2; 256K/64K; reasoning)
# - https://ofox.ai/en/models (catalog listing for bailian/qwen3.6-max-preview)
# Toggle: enable_thinking true|false (Alibaba Bailian chat path; matches lab + ofox bailian/qwen3.7-max)
# Budget: thinking_budget
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen).
schema = 2
base_model = "alibaba/qwen3.6-max-preview"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 2.15
cache = { read = 0.2, write = 1.17 }

[cost.text.output]
price = 12.86
