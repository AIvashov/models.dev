# Sources (accessed 2026-09-11):
# https://ofox.ai/models/qwen/qwen-max
# https://api.ofox.ai/v1/models/qwen/qwen-max
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen).
# structured_output: Ofox's Qwen page documents response_format json_schema (https://ofox.ai/docs/develop/models/qwen); Alibaba's own API agrees (providers/alibaba).
schema = 2
base_model = "alibaba/qwen-max"

[capabilities]
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 32_000
output = 8_000

[cost.text.input]
price = 0.35
cache = { read = 0.069 }

[cost.text.output]
price = 1.38
