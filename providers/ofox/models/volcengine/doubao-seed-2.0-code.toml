# Source: https://api.ofox.ai/v2/models/catalog?include=provider_price&limit=500
# Toggle: thinking.type = enabled|disabled (Volcengine Ark chat path)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
schema = 2
base_model = "bytedance-seed/seed-2.0-code"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 256_000
output = 128_000

[cost.text.input]
price = 0.67
cache = { read = 0.14, write = 0.0024 }

[cost.text.output]
price = 3.36
