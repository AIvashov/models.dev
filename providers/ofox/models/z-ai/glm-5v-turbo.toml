# Sources:
# - https://ofox.ai/models/z-ai/glm-5v-turbo (pricing $1.2/$4 per MTok, cache_read $0.24; context 200K; output 128K)
# - https://docs.z.ai/guides/overview/concept-param (thinking.type for GLM-5V-Turbo)
# Toggle: thinking.type = enabled|disabled
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): effort_updates and tools.updates are unset; Ofox documents neither and they weren't tested live.
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/glm).
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
