# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "DeepSeek: DeepSeek Pro Latest"
description = "This model always redirects to the latest model in the DeepSeek Pro family."
family = "deepseek"
open_weights = false
release_date = "2026-09-14"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 393_216

[cost.text.input]
price = 0.225
cache = { read = 0.23 }

[cost.text.output]
price = 8
