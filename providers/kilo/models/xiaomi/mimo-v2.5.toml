# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Deprecated: Kilo's catalog names it "Xiaomi: MiMo-V2.5 (retires Oct 21)" (GET https://api.kilo.ai/api/gateway/models, 2026-10-20)
schema = 2
base_model = "xiaomi/mimo-v2.5"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.003 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.8
cache = { read = 0.16 }

[cost.text.output]
price = 0.28

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 4
