# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Deprecated: Amazon Nova Premier reached end of life on Bedrock (2026-09-14). Kilo serves it through OpenRouter (Vercel AI Gateway doesn't list it), where it is deprecated.
schema = 2
base_model = "amazon/nova-premier"
name = "Amazon: Nova Premier 1.0"
description = "Flagship model for demanding analysis, coding, and production agent workflows"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
structured_output = false

[limit]
output = 32_000

[cost.text.input]
price = 2.5
cache = { read = 0.625 }

[cost.text.output]
price = 12.5
