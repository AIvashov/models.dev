# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
output = 235_929

[cost.text.input]
price = 0.042
cache = { read = 0.021 }

[cost.text.output]
price = 0.22
