# tool_call = false: Kilo's catalog (https://api.kilo.ai/api/gateway/models) lists supported_parameters for
#   cohere/command-a without "tools" or "tool_choice" (checked 2026-10-20), and the Kilo sync derives tool_call from those.
# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "cohere/command-a"
description = "Cohere command model for multilingual enterprise agents, tools, and chat"

[capabilities]
tools = { supported = false }
structured_output = true

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
