# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "cohere/command-a-plus-05-2026"
name = "Cohere: Command A+"
description = "Command A+ is Cohere's flagship model for enterprise agentic workflows. It accepts text and image inputs with a 192K context window, supports native tool calling with strict tool schemas, structured..."

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 192_000

[cost.text.input]
price = 0.3
cache = { read = 0.15 }

[cost.text.output]
price = 1.5
