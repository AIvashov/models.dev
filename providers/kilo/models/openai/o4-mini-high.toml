# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "OpenAI: o4 Mini High"
description = "O-series reasoning model for hard analysis, math, coding, and planning"
family = "o"
open_weights = false
release_date = "2025-04-16"

[modalities]
input = ["image", "text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
temperature = false

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
