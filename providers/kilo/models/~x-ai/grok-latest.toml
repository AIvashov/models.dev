# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "xAI: Grok Latest"
description = "This model always redirects to the latest Grok model from xAI."
family = "grok"
open_weights = false
release_date = "2026-07-08"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[limit]
context = 500_000
output = 450_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
