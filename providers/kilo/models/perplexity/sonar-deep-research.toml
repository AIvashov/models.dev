# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "Perplexity: Sonar Deep Research"
description = "Sonar search model for current answers, retrieval, and citation-backed chat"
family = "sonar-deep-research"
open_weights = false
release_date = "2025-03-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = false
temperature = true

[limit]
context = 128_000
output = 115_200

[cost.text.input]
price = 2

[cost.text.output]
price = 8
reasoning = 3
