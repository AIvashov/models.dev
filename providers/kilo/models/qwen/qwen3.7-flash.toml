# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates and tools.updates unset: Kilo documents neither and they weren't tested live.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "alibaba/qwen3.7-flash"
description = "Qwen3.7 Flash is a vision-language reasoning model from Alibaba. It is suited for multimodal agents, visual coding, search, and computer interaction, with strengths in object recognition, spatial understanding, and real-world..."

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[limit]
output = 65_536

[cost.text.input]
price = 0.03
cache = { read = 0.006, write = 0.038 }

[cost.text.output]
price = 0.13
