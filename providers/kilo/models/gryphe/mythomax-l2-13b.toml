name = "MythoMax 13B"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"

[capabilities]
structured_output = true

[limit]
output = 3_686

[cost.text.input]
price = 0.08

[cost.text.output]
price = 0.11
