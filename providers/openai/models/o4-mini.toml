schema = 2
name = "o4-mini"
description = "Fast o-series model for compact reasoning, coding, and tool use"
family = "o-mini"
open_weights = false
knowledge = "2024-05"
release_date = "2025-04-16"
status = "deprecated"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.fast.cost.text.input]
price = 2
cache = { read = 0.5 }

[experimental.modes.fast.cost.text.output]
price = 8

[experimental.modes.flex]
body = { service_tier = "flex" }
