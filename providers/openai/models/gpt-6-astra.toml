# Pricing: https://developers.openai.com/api/docs/models/gpt-6-astra
# Reasoning and modes: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-astra
# Ultrafast mode: https://developers.openai.com/api/docs/guides/ultrafast-mode
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = 6

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.pro]
body = { reasoning = { mode = "pro" } }

[experimental.modes.ultrafast]
body = { service_tier = "ultrafast" }
