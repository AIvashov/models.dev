schema = 2
name = "GPT-5.4 nano"
description = "Cheapest GPT-5.4 lane for simple routing, extraction, and bulk automation"
family = "gpt-nano"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-03-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.flex]
body = { service_tier = "flex" }
