# Sources: https://developers.openai.com/api/docs/models/gpt-daybreak-blue-latest
# https://developers.openai.com/api/docs/pricing
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "Daybreak Blue"
description = "Alias for flagship general-purpose models with safeguards for defensive cybersecurity work"
release_date = "2026-08-07"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
