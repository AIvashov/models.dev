# structured_output = true: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.12
cache = { read = 0.0025 }

[cost.text.output]
price = 0.25
