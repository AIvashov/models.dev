# system_updates = true: the gateway keeps later system messages in place on openai, azure (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
# Cache: automatic prompt caching (https://docs.llmgateway.io/features/caching/provider-cache-control)
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
