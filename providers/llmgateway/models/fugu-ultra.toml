# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "sakana/fugu-ultra"

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
output = 1_000_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
