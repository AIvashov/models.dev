# Modalities: image formats JPEG, PNG, WebP, GIF (https://docs.llmgateway.io/features/vision)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
name = "Fugu Ultra v2.0"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"
family = "fugu"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
