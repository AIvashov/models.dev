# Modalities: image formats from models/mistral/mistral-medium-3-5.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "mistral/mistral-medium-3-5"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 1.5

[cost.text.output]
price = 7.5
