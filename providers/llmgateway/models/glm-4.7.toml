# Toggle: $.reasoning_effort (or $.reasoning.effort) = "none" disables thinking; any other value enables it.
# On the Z.AI mapping the gateway sends thinking.type = "disabled"|"enabled" (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts, case "zai").
# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-4.7"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.38
cache = { read = 0.19, write = 0 }

[cost.text.output]
price = 1.98
