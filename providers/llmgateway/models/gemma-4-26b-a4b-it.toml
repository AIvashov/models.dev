# Reasoning: no caller on/off control. DeepInfra is the only reasoning mapping, the gateway drops reasoning_effort = "none"
#   for it (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts L1700-1727), and any other value is
#   forwarded as-is with no documented effect on this deployment (packages/models/src/models/google.ts gemma-4-26b-a4b-it).
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.34
