# Modalities: image formats from models/baidu/ernie-4.5-vl-424b-a47b.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
name = "ERNIE 4.5 VL 424B A47B"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "ernie"
open_weights = false
release_date = "2025-06-30"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 123_000
output = 123_000

[cost.text.input]
price = 0.42

[cost.text.output]
price = 1.25
