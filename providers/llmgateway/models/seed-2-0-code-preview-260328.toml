# Modalities: image formats from models/bytedance-seed/seed-2.0-code.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
name = "Seed 2.0 Code Preview (260328)"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
family = "seed"
open_weights = false
release_date = "2026-03-28"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = false
temperature = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
