# system_updates = true: the gateway keeps later system messages in place on google-ai-studio, google-vertex (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "google/gemini-3.1-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
system_updates = true

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 0.08333 }

[cost.text.output]
price = 1.5
