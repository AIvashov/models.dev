# Gateway-wide $.reasoning_effort = "none" disables non-OpenAI reasoning;
# this model has no documented effort tiers or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-06-25)
# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "xiaomi/mimo-v2.5-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.522
cache = { read = 0.0043 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 2
cache = { read = 0.4 }

[cost.text.output]
price = 1.044

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 6
