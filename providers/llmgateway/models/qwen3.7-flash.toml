# Modalities: image formats from models/alibaba/qwen3.7-flash.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3.7-flash"
base_model_omit = ["limit.input"]
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false

[limit]
context = 983_616
output = 1_000_000

[cost.text.input]
price = 0.03
cache = { read = 0.006, write = 0.0375 }

[cost.text.output]
price = 0.13
