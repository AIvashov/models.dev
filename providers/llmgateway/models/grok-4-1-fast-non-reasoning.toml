# Modalities: image formats from models/xai/grok-4.3.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
name = "Grok 4.1 Fast Non-Reasoning"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"
family = "grok"
open_weights = false
release_date = "2025-11-19"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 2_000_000
output = 2_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
