# Modalities: image formats from models/alibaba/qwen3-vl-30b-a3b-instruct.toml (same model)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
