# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
schema = 2
base_model = "mistral/codestral-2508"
name = "Codestral"
description = "Mistral coding model for code completion, generation, and developer workflows"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.3

[cost.text.output]
price = 0.9
