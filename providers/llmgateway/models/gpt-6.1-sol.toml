# system_updates = true: the gateway keeps later system messages in place on openai, azure (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates and tools.updates unset: LLM Gateway documents neither and they weren't tested live.
# Cache: automatic, plus prompt_cache_options explicit mode with prompt_cache_breakpoint and optional 30m TTL on GPT-5.6+ (https://docs.llmgateway.io/features/caching/provider-cache-control)
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
cache = { supported = true, implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
