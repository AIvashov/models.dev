# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (scaleway, nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3-235b-a22b-instruct-2507"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
cache = { supported = false }
structured_output = true

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.199
cache = { read = 0.018 }

[cost.text.output]
price = 0.598
