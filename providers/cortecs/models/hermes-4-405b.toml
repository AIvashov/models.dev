# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "nousresearch/hermes-4-405b"
description = "Hermes 4 405B is a frontier hybrid-mode reasoning model built on Llama 3.1, optimized for advanced logic, math, coding, and structured output generation."

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
cache = { supported = false }
structured_output = true
temperature = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.996

[cost.text.output]
price = 2.989
