# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (amazon_ireland, amazon_paris). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "mistral-7b-instruct-v0.2"
description = "Mistral 7B Instruct is a compact, 7B parameter model optimized for fast and efficient text and code generation with a 32K token context window."
open_weights = false
release_date = "2025-05-26"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { supported = false }
structured_output = false
temperature = false

[limit]
context = 32_000
output = 8_192

[cost.text.input]
price = 0.159

[cost.text.output]
price = 0.219
