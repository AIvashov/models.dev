# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (amazon_ireland). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/devstral-2512"
description = "Mistral coding agent model for repository tasks and software engineering workflows"

[capabilities]
cache = { supported = false }
structured_output = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.478
cache = { read = 0.045 }

[cost.text.output]
price = 2.392
