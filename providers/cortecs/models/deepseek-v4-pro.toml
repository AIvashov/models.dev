# Effort: Cortecs "accepts: 'reasoning_effort': 'low' | 'medium' | 'high'" (https://docs.cortecs.ai/routing/reasoning, "Controlling Reasoning").
# Open: Cortecs documents no reasoning_effort mapping or native thinking/max control for its only route, Arkane (same page); left as is, see PR.
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: automatic prefix caching on every routed provider (arkane). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "deepseek/deepseek-v4-pro"
base_model_omit = ["structured_output"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.7
cache = { read = 0.15 }

[cost.text.output]
price = 3.4
