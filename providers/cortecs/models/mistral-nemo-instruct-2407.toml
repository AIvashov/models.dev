# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (ovh, ionos). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/mistral-nemo"
name = "mistral-nemo-instruct-2407"
description = "A 12B parameter, instruct-tuned language model by Mistral AI and NVIDIA, designed for advanced instruction following, multi-turn conversations, and generating text and code across multiple languages."

[capabilities]
cache = { supported = false }
structured_output = true
temperature = false

[cost.text.input]
price = 0.145
cache = { read = 0.014 }

[cost.text.output]
price = 0.145
