# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "minicpm-v-4.5"
description = "MiniCPM-V 4.5 is a compact, high-performance vision-language model excelling in video understanding, OCR, and multimodal reasoning with efficient deployment."
open_weights = false
release_date = "2026-06-02"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
cache = { supported = false }
structured_output = true
temperature = false

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 0.651

[cost.text.output]
price = 1.097
