# No toggle: Cortecs documents a thinking on/off switch only for Anthropic and Entrim, not for this model's routes (amazon_ireland).
# https://docs.cortecs.ai/routing/reasoning
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (amazon_ireland). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "zhipuai/glm-4.7-flash"
description = "Efficient GLM model for fast reasoning, coding, and agent workflows"

[capabilities]
reasoning = { supported = true }
cache = { supported = false }
structured_output = true

[limit]
context = 203_000
output = 203_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.08

[cost.text.output]
price = 0.478
