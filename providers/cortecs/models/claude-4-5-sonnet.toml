# Effort: reasoning_effort = low|medium|high; Cortecs maps it to thinking.budget_tokens 1024|2048|4096 (or output_config.effort where the model has it).
# Budget: thinking = { type = "enabled", budget_tokens } (https://docs.cortecs.ai/routing/reasoning).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: explicit `cache_control` breakpoints (Claude on Amazon Bedrock / Google Vertex). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], budget = { min = 1_024 } }
cache = { supported = true, explicit = true }
structured_output = true

[cost.text.input]
price = 2.989
cache = { read = 0.326, write = 4.078 }

[cost.text.output]
price = 14.945
