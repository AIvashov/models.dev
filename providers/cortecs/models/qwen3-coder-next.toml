# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (ionos). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3-coder-next"
description = "Qwen coding model for software agents, repository edits, and code reasoning"

[capabilities]
cache = { supported = false }
structured_output = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.167

[cost.text.output]
price = 0.891
