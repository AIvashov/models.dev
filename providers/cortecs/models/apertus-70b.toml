# Reasoning: inherits the lab's supported = false. The /v1/models "reasoning" feature tag is not model evidence (it is also set on gpt-4o and gpt-4.1).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
schema = 2
base_model = "swiss-ai/apertus-70b"
description = "Apertus 70B is an open, multilingual language model designed for research, long-context reasoning, and sovereignty-focused AI systems."

[capabilities]
structured_output = false
temperature = false

[limit]
output = 16_384

[cost.text.input]
price = 1.393

[cost.text.output]
price = 2.228
