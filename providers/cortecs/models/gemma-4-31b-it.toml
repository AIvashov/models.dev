# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (infercom, berget). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "google/gemma-4-31b-it"

[capabilities]
reasoning = { supported = true }
cache = { supported = false }
structured_output = true

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.223

[cost.text.output]
price = 0.39
