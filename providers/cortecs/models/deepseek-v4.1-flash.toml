# Effort: Cortecs "accepts: 'reasoning_effort': 'low' | 'medium' | 'high'" (https://docs.cortecs.ai/routing/reasoning, "Controlling Reasoning").
# Mapping: Tensorix, "Cortecs accepts the standard reasoning_effort parameter and automatically maps it to Tensorix's format"; DeepSeek "require[s] reasoning_effort to be provided to enable it" (same page).
# Open: Cortecs documents no reasoning_effort mapping or native thinking/max control for its Arkane and Scaleway routes; Entrim allows only low|high|max (same page); left as is, see PR.
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_048_576
output = 393_216

[cost.text.input]
price = 0.201
cache = { read = 0.004 }

[cost.text.output]
price = 0.6
