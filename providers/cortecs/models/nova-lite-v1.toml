# Reasoning: inherits the lab's supported = false. The /v1/models "reasoning" feature tag is not model evidence (it is also set on gpt-4o and gpt-4.1).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (amazon_ireland, amazon_paris). https://docs.cortecs.ai/routing/prompt-caching
# Input MIME types: the lab's types for each kind the Cortecs catalog lists (https://api.cortecs.ai/v1/models input_modalities).
schema = 2
base_model = "amazon/nova-lite-v1"
description = "Nova Lite is a fast, low-cost multimodal foundation model capable of reasoning over text, images, and video in 200+ languages."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
cache = { supported = false }
structured_output = true
temperature = false

[limit]
output = 10_000

[cost.text.input]
price = 0.069

[cost.text.output]
price = 0.275
