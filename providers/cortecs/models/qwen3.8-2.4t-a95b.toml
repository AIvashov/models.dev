# Sources (accessed 2026-08-16):
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
# Lab reasoning_effort is low|medium|xhigh (not high). Cortecs cost/limits retained.
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: automatic prefix caching on every routed provider (tensorix). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
cache = { supported = true, implicit = true }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 2.5
cache = { read = 0.625 }

[cost.text.output]
price = 6
