# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: automatic prefix caching on every routed provider (mistral). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/voxtral-small-24b-2507"
name = "voxtral-small-2507"
description = "Voxtral Small is a multimodal model with audio input, combining advanced speech capabilities with strong text performance for transcription, translation, and audio understanding."

[capabilities]
cache = { supported = true, implicit = true }
structured_output = true
temperature = false

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 0.123
cache = { read = 0.012 }

[cost.text.output]
price = 0.368
