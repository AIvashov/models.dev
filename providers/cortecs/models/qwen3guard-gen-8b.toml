# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (ovh). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "qwen3guard-gen-8b"
description = "Qwen3Guard-Gen-8B is a large-scale multilingual safety moderation model designed for high-accuracy prompt and response classification."
open_weights = false
release_date = "2026-02-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { supported = false }
structured_output = false
temperature = false

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
