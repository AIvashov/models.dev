# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
schema = 2
base_model = "mistral/ministral-14b-2512"
description = "Ministral 3 14B is a frontier-level 14B multimodal model optimized for local deployment, delivering state-of-the-art text and vision reasoning with a 256K context window and strong agentic capabilities."

[capabilities]
structured_output = true
temperature = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.24
cache = { read = 0.022 }

[cost.text.output]
price = 0.24
