# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (scaleway, amazon_ireland). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3-coder-30b-a3b-instruct"

[capabilities]
cache = { supported = false }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.179
cache = { read = 0.014 }

[cost.text.output]
price = 0.697
