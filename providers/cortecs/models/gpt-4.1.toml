# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: automatic prefix caching on every routed provider (azure_sc, azure_spc). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "openai/gpt-4.1"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
cache = { supported = true, implicit = true }
structured_output = false

[cost.text.input]
price = 2.192
cache = { read = 0.546 }

[cost.text.output]
price = 8.769
