# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions (https://docs.cortecs.ai/api/chat-completions); system_updates, effort_updates and tools.updates are unset: Cortecs documents none of them and they weren't tested live.
# Cache: not supported by the routed providers (ovh, scaleway, berget). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/mistral-small-3.2-24b-instruct"
name = "mistral-small-3.2-24b-instruct-2506"
description = "Mistral-Small-3.2-24B-Instruct-2506 is a 24B parameter instruction-tuned model with enhanced long-context support (128k) and state-of-the-art vision understanding."

[capabilities]
cache = { supported = false }
structured_output = true
temperature = false

[limit]
context = 131_000
output = 131_000

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.312
