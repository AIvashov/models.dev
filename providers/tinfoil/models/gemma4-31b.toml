# Mid-conversation: Tinfoil serves this model on POST /v1/chat/completions (https://docs.tinfoil.sh/models/chat); system_updates, effort_updates and tools.updates are unset: Tinfoil documents none of them and they weren't tested live.
schema = 2
base_model = "google/gemma-4-31b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1
