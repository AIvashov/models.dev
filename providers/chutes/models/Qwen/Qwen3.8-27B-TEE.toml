# Mid-conversation: Chutes serves this model on POST https://llm.chutes.ai/v1/chat/completions (https://llm.chutes.ai/v1/models); system_updates, effort_updates and tools.updates are unset: Chutes documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; Chutes' catalog reports image input without formats (https://llm.chutes.ai/v1/models).
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B TEE"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 65_536

[cost.text.input]
price = 0.039
cache = { read = 0.003899999999999999 }

[cost.text.output]
price = 1.25
