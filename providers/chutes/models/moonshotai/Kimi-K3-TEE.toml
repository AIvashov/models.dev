# Toggle: chat_template_kwargs.thinking = true|false
# Verified live on POST https://llm.chutes.ai/v1/chat/completions: reasoning_content present when on, absent when off
# Mid-conversation: Chutes serves this model on POST https://llm.chutes.ai/v1/chat/completions (https://llm.chutes.ai/v1/models); system_updates, effort_updates and tools.updates are unset: Chutes documents none of them and they weren't tested live.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 TEE"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
output = 65_535

[cost.text.input]
price = 1.85
cache = { read = 0.18499999999999997 }

[cost.text.output]
price = 9.5
