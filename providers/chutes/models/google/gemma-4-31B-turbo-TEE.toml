# Toggle: chat_template_kwargs.enable_thinking = true|false
# Source: https://huggingface.co/google/gemma-4-31b-it (chat template exposes enable_thinking)
# Verified live on POST https://llm.chutes.ai/v1/chat/completions: reasoning_content present when on, absent when off
# Mid-conversation: Chutes serves this model on POST https://llm.chutes.ai/v1/chat/completions (https://llm.chutes.ai/v1/models); system_updates, effort_updates and tools.updates are unset: Chutes documents none of them and they weren't tested live.
schema = 2
base_model = "google/gemma-4-31b-it"
name = "gemma 4 31B turbo TEE"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 131_072
output = 65_536

[cost.text.input]
price = 0.12
cache = { read = 0.011999999999999997 }

[cost.text.output]
price = 0.37
