# Not included in subscription
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates unset: NanoGPT documents no mid-conversation tool change and it wasn't tested live.
# Cache: implicit (automatic) for OpenAI models (https://docs.nano-gpt.com/api-reference/miscellaneous/prompt-caching)
schema = 2
base_model = "openai/gpt-5.3-codex"
name = "GPT 5.3 Codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false
cache = { supported = true, implicit = true }

[limit]
input = 400_000

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
