# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates unset: NanoGPT documents no mid-conversation tool change and it wasn't tested live.
schema = 2
name = "GLM 4.6 Derestricted v5"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "glm"
open_weights = true
release_date = "2025-12-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false
effort_updates = false

[limit]
context = 131_072
input = 131_072
output = 8_192

[cost.text.input]
price = 0.4
cache = { read = 0.2 }

[cost.text.output]
price = 1.5
