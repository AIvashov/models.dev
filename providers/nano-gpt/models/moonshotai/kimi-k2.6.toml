# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates unset: NanoGPT documents no mid-conversation tool change and it wasn't tested live.
# Modalities (image: the lab's formats that NanoGPT Chat Completions accepts): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = false
effort_updates = false

[limit]
input = 262_144
output = 65_536

[cost.text.input]
price = 0.45
cache = { read = 0.045 }

[cost.text.output]
price = 1.95
