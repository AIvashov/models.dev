# API: @aihubmix/ai-sdk-provider sends claude-* models to Anthropic Messages (POST https://aihubmix.com/v1/messages with x-api-key), which keeps cache_control breakpoints and signed thinking. https://docs.aihubmix.com/cn/api/Anthropic-Compatible.md
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
# Toggle: see provider.toml (Chat `reasoning_effort = none`, Messages `thinking.type = disabled`).
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
sdk = { opencodeai = "@opencode/ai/providers/anthropic-compatible" }
legacy_interleaved = true

[api.chat-completions]

[cost.text.input]
price = 11
cache = { read = 1.1, write = { "5m" = 13.75, "1h" = 22 } }

[cost.text.output]
price = 55
