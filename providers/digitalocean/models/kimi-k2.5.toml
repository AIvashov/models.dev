# Lifecycle: lifecycle_status = end_of_life in https://api.digitalocean.com/v2/gen-ai/models (2026-10-20).
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi model for long-context chat, coding, and agentic reasoning"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.203 }

[cost.text.output]
price = 2.7
