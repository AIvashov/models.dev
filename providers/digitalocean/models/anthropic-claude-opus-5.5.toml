# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: explicit cache_control (ttl 5m|1h); automatic only through the Inference Router. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "anthropic/claude-opus-5-5"
name = "Anthropic Claude Opus 5.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"] } }
system_updates = true

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 8
cache = { read = 0.4, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 30
