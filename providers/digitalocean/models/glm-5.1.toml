# Lifecycle: lifecycle_status = end_of_life in https://api.digitalocean.com/v2/gen-ai/models (2026-10-20).
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-5.1"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 163_840
output = 163_840

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.26 }

[cost.text.output]
price = 4.3
