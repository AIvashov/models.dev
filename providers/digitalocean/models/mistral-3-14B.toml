# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
# system_updates = false: live 2026-10-20, a system message after an assistant turn returns 400 ("Unexpected role 'system' after role 'assistant'").
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "mistral/ministral-3-14b-instruct-2512"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = false
prompt_cache_key = true

[limit]
output = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.2
