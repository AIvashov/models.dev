# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = true
prompt_cache_key = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.14
cache = { read = 0.028 }

[cost.text.output]
price = 0.28
