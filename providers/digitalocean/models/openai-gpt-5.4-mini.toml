# Serverless supports only POST `/v1/responses`; use
# `reasoning.effort = none|low|medium|high|xhigh`.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4-mini (accessed 2026-06-25)
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: automatic for prompts of 1024+ tokens. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "openai/gpt-5.4-mini"
name = "OpenAI GPT-5.4 Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { supported = true, implicit = { min_tokens = 1_024 } }
structured_output = true
temperature = false
system_updates = true

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
