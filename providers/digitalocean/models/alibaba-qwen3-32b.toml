# Lifecycle: lifecycle_status = end_of_life in https://api.digitalocean.com/v2/gen-ai/models (2026-10-20).
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions; effort_updates and tools.updates
# are unset: DigitalOcean documents neither and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3-32b"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.25

[cost.text.output]
price = 0.55
