# Mid-conversation: Hyper serves this model on POST /v1/chat/completions (https://hyper.charm.land/v1/models); system_updates, effort_updates and tools.updates are unset: Hyper documents none of them and they weren't tested live.
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
