# Mid-conversation: Hyper serves this model on POST /v1/chat/completions (https://hyper.charm.land/v1/models); system_updates, effort_updates and tools.updates are unset: Hyper documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; Hyper's catalog reports vision without formats (https://hyper.charm.land/v1/models).
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
