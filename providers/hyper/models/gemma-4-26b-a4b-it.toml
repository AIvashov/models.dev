# Mid-conversation: Hyper serves this model on POST /v1/chat/completions (https://hyper.charm.land/v1/models); system_updates, effort_updates and tools.updates are unset: Hyper documents none of them and they weren't tested live.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 256_000
output = 25_600

[cost.text.input]
price = 0.098
cache = { read = 0.049 }

[cost.text.output]
price = 0.334
