# Effort: reasoning_effort = none|high|max
# Pricing: GET https://api.aiand.com/v1/api.json (accessed 2026-09-14); synced hourly by the aiand module.
# Docs: https://docs.aiand.com/models/catalog/
# Live probe 2026-09-14: none|high|max → 200; minimal|low|medium|xhigh → 400.
# context_window = 1048576 on this host overrides the lab's 1_000_000.
# Reasoning side channel: message.reasoning_content
# Mid-conversation: ai& serves this model on POST /v1/chat/completions (https://docs.aiand.com/api/chat-completions/); system_updates, effort_updates and tools.updates are unset: ai& documents none of them and they weren't tested live.
# Cache: repeated prompt prefixes are cached automatically, no cache_control markers (https://docs.aiand.com/models/pricing/#prompt-caching).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
cache = { supported = true, implicit = true }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.25 }

[cost.text.output]
price = 2.5
