# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (thinkingmachines/inkling).
schema = 2
base_model = "thinkingmachines/inkling"
description = "Multimodal model for analyzing text, images, documents, and rich media"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1

[cost.text.output]
price = 4.05
