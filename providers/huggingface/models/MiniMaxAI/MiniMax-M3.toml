# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (minimax/MiniMax-M3).
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 524_288

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
