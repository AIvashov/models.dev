# Meta lists the Llama 3.1 release date as July 23, 2024.
# https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md
# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
schema = 2
base_model = "meta/llama-3.1-8b-instruct"
name = "Llama 3.1 8B"
description = "Efficient conversational model optimized for responsive multilingual chatbot interactions."

[capabilities]
structured_output = true

[limit]
context = 131_072
output = 131_072

[cost.text.input]
price = 0.22
cache = { read = 0.22 }

[cost.text.output]
price = 0.22
