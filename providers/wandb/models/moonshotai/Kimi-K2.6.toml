# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; CoreWeave's catalog reports image input without formats (https://trace.wandb.ai/inference/modelsdev/models).
schema = 2
base_model = "moonshotai/kimi-k2.6"
description = "Kimi K2.6 is a multimodal Mixture-of-Experts language model featuring 32 billion activated parameters and a total of 1 trillion parameters."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.65
cache = { read = 0.15 }

[cost.text.output]
price = 3.41
