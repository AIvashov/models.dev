# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v3.1"
name = "DeepSeek V3.1"
description = "A large hybrid model that supports both thinking and non-thinking modes via prompt templates."

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 161_000
output = 161_000

[cost.text.input]
price = 0.55
cache = { read = 0.55 }

[cost.text.output]
price = 1.65
