# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; CoreWeave's catalog reports image input without formats (https://trace.wandb.ai/inference/modelsdev/models).
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"
description = "MiniMax M3 is a multimodal MoE model with 23B active parameters optimized for coding and agentic workflows."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.23
cache = { read = 0.05 }

[cost.text.output]
price = 0.96
