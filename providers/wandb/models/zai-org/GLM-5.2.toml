# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
schema = 2
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"
description = "GLM-5.2 is a Mixture-of-Experts language model featuring 40 billion activated parameters and a total of 744 billion parameters."

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.62
cache = { read = 0.14 }

[cost.text.output]
price = 2.42
