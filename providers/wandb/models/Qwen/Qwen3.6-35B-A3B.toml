# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; CoreWeave's catalog reports image input without formats (https://trace.wandb.ai/inference/modelsdev/models).
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"
name = "Qwen3.6 35B A3B"
description = "Qwen3.6-35B-A3B is an MoE multimodal model with 262K context optimized for agentic coding workflows."

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.25
cache = { read = 0.25 }

[cost.text.output]
price = 1.25
