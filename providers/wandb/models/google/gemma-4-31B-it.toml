# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions (https://docs.wandb.ai/inference); system_updates, effort_updates and tools.updates are unset: CoreWeave documents none of them and they weren't tested live.
schema = 2
base_model = "google/gemma-4-31b-it"
name = "Gemma 4 31B"
description = "Gemma 4 31B Dense is designed for advanced reasoning, agentic workflows, and longer context and is natively trained on 140+ languages."

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.1
cache = { read = 0.1 }

[cost.text.output]
price = 0.34
