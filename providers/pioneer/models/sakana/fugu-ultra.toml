# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: the underlying model's controls from providers/sakana/models/fugu-ultra.toml; Pioneer's catalog listed the same boilerplate levels on every model.
# Effort: reasoning.effort = high|xhigh in the same object, rendered to the upstream's native field.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): effort_updates and tools.updates unset: Fastino documents neither and they weren't tested live.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
base_model = "sakana/fugu-ultra"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh"] }
structured_output = true

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 5 }

[cost.text.output]
price = 30
