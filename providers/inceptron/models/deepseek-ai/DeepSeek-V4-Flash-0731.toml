# Mid-conversation: Inceptron serves this model on POST /v1/chat/completions (https://docs.inceptron.io); system_updates, effort_updates and tools.updates are unset: Inceptron documents none of them and they weren't tested live.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.13
cache = { read = 0.03, write = 0 }

[cost.text.output]
price = 0.28
