# Mid-conversation: Inceptron serves this model on POST /v1/chat/completions (https://docs.inceptron.io); system_updates, effort_updates and tools.updates are unset: Inceptron documents none of them and they weren't tested live.
# Input MIME types: the lab's image list; Inceptron's catalog reports image input without formats (https://api.inceptron.io/v1/models).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.66
cache = { read = 0.18, write = 0 }

[cost.text.output]
price = 3.4
